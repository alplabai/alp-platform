<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Reading a platform version">
<title>Reading a platform version</title>
<style>
  .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
  .t{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
  .q{fill:#59636e}
  .h{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.25}
  .acc{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
  .own{fill:#ffffff;stroke:#0969da;stroke-width:1.25}
  .rec{fill:#f6f8fa;stroke:#8c959f;stroke-width:1;stroke-dasharray:4 3}
  .hw{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.25}
  .warn{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
  .ln{stroke:#8c959f;stroke-width:1.25;fill:none}
  .lnacc{stroke:#0969da;stroke-width:1.5;fill:none}
  .band1{fill:#0969da;fill-opacity:.22;stroke:#0969da;stroke-width:1.25}
  .band2{fill:#bc4c00;fill-opacity:.16;stroke:#bc4c00;stroke-width:1.25}
  .grid{stroke:#d0d7de;stroke-width:1}
  .ah{fill:#8c959f}
  .ahacc{fill:#0969da}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117;stroke:#30363d}
    .t{fill:#e6edf3} .q{fill:#9198a1}
    .box{fill:#161b22;stroke:#656c76}
    .acc{fill:#0d2a4a;stroke:#4493f8}
    .own{fill:#161b22;stroke:#4493f8}
    .rec{fill:#151b23;stroke:#656c76}
    .hw{fill:#0f2e1a;stroke:#3fb950}
    .warn{fill:#341a00;stroke:#db6d28}
    .ln{stroke:#656c76} .lnacc{stroke:#4493f8}
    .band1{fill:#4493f8;stroke:#4493f8}
    .band2{fill:#db6d28;stroke:#db6d28}
    .grid{stroke:#30363d}
    .ah{fill:#656c76} .ahacc{fill:#4493f8}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahacc" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="759" height="379" rx="12"/>
<text class="t h" x="24" y="36" font-size="18" text-anchor="start">Reading a platform version</text>
<text class="t h mono" x="120" y="118" font-size="44">27.2.1-rc1</text>
<path class="lnacc" d="M122.0 132H170.8"/>
<text class="t h" x="146.4" y="154" font-size="13" text-anchor="middle">YY</text>
<path class="lnacc" d="M201.2 132H223.6"/>
<text class="t h" x="212.39999999999998" y="154" font-size="13" text-anchor="middle">M</text>
<path class="lnacc" d="M254.0 132H276.4"/>
<text class="t h" x="265.2" y="154" font-size="13" text-anchor="middle">MICRO</text>
<path class="lnacc" d="M280.4 132H382.0"/>
<text class="t h" x="331.2" y="154" font-size="13" text-anchor="middle">rcN</text>
<text class="t h mono" x="120" y="200" font-size="13" text-anchor="start">YY</text>
<text class="t q" x="190" y="200" font-size="13" text-anchor="start">27 = 2027</text>
<text class="t h mono" x="120" y="224" font-size="13" text-anchor="start">M</text>
<text class="t q" x="190" y="224" font-size="13" text-anchor="start">never zero-padded: 27.2, not 27.02</text>
<text class="t h mono" x="120" y="248" font-size="13" text-anchor="start">MICRO</text>
<text class="t q" x="190" y="248" font-size="13" text-anchor="start">fixes inside one line</text>
<text class="t h mono" x="120" y="272" font-size="13" text-anchor="start">rcN</text>
<text class="t q" x="190" y="272" font-size="13" text-anchor="start">sorts before the GA it leads to</text>
<rect class="rec" x="24" y="306" width="712" height="50" rx="8"/>
<text class="t h" x="40" y="330" font-size="12" text-anchor="start">Git tag</text>
<text class="t mono" x="110" y="330" font-size="13" text-anchor="start">platform-v27.2.1-rc1</text>
<text class="t h" x="40" y="348" font-size="12" text-anchor="start">Line</text>
<text class="t q" x="110" y="348" font-size="12" text-anchor="start">27.2  — a bare line resolves to its newest GA MICRO</text>
</svg>
