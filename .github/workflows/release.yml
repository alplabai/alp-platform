name: release

on:
  push:
    tags: ["platform-v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tag equals the manifest platform field, and the tagged commit is on its line branch
        run: |
          set -eu
          v=$(python -c "import sys; sys.path.insert(0, 'tools'); import platform_manifest as p; print(p.load_manifest('platform.yaml')['platform'])")
          if [ "platform-v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match platform.yaml (platform-v$v)" >&2
            exit 1
          fi
          line=$(echo "$v" | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')
          git fetch origin "line/$line"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/line/$line"; then
            echo "tagged commit $GITHUB_SHA is not on origin/line/$line" >&2
            exit 1
          fi
      - name: Online manifest gate
        env:
          GITHUB_TOKEN: ${{ secrets.PLATFORM_GATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/platform_manifest.py check platform.yaml --online

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-rc*) flags="--prerelease";; esac
          python tools/platform_manifest.py table platform.yaml > release-table.md
          gh release create "$GITHUB_REF_NAME" platform.yaml \
            --repo "$GITHUB_REPOSITORY" --title "Alp Platform ${GITHUB_REF_NAME#platform-v}" \
            --notes-file release-table.md $flags
