name: manifest-gate

on:
  push:
    branches: ["main", "line/**"]
  pull_request:
    branches: ["main", "line/**"]

permissions:
  contents: read

jobs:
  tooling-tests:
    if: github.base_ref == 'main' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  manifest:
    if: startsWith(github.base_ref || github.ref_name, 'line/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check platform.yaml against the published components
        env:
          # The component repos are public; PLATFORM_GATE_TOKEN is optional (rate limits,
          # or a component repo that becomes private).
          GITHUB_TOKEN: ${{ secrets.PLATFORM_GATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/platform_manifest.py check platform.yaml --online
